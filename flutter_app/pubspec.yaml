name: web_developer_hub
description: "All-in-One Web Developer Hub: CSS Generator, Text Analyzer, Screen Resizer & Cloud Snippets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.1.0
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.8
  http: ^1.2.0
  clipboard: ^0.1.3
  url_launcher: ^6.2.4
  webview_flutter: ^4.7.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
